# /usr/lib/tmpfiles.d/hmi.conf
# systemd-tmpfiles configuration for the HMI subsystem.
#
# These entries are processed by systemd-tmpfiles --create early in boot
# (systemd-tmpfiles-setup.service) to create volatile runtime directories
# that live on tmpfs and therefore do not survive reboot.
#
# Without this file the HMI installer and GUI service would fail at
# runtime because /run/hmi and /tmp/hmi_upload would not exist.
#
# Type  Path              Mode  User  Group  Age  Argument
# ----  ----              ----  ----  -----  ---  --------

# /run/hmi -- runtime state directory for the HMI subsystem.
# Holds install.lock (flock guard), gui-ready (GUI readiness sentinel),
# and any other transient runtime files.  Mode 0755 allows all services
# to read but only root to write.  Owned by root:root because the
# installer and services run as root on this BSP.
d /run/hmi 0755 root root -

# /tmp/hmi_upload -- upload landing zone for bundle tarballs.
# The host-side deploy script (or forced SSH command) writes bundles here.
# Mode 0700 restricts access to root only, preventing unprivileged users
# from injecting malicious bundles.  Cleaned at boot so stale uploads
# from a previous session cannot accumulate.
D /tmp/hmi_upload 0700 root root -
