# Continuous integration for EmbeddedDisplay.
#
# WHY THIS EXISTS
#   The cross-validator suite, the installer atomicity suite and everything
#   else that needs flock only run on a POSIX host. Development happens on
#   Windows, where those tests skip -- so before this workflow existed, the
#   suites guarding the deployment chain had no automated run anywhere, and a
#   green local result meant one of the three manifest validators had been
#   exercised.
#
#   The whole point of this file is that the Linux-only half of the suite runs
#   on every push, and that a skip is visible rather than silent.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A second push to the same branch supersedes the first; there is no value in
# finishing a run against a commit nobody will look at again.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Full suite (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Qt needs these even under the offscreen platform plugin: libEGL and
      # the xkb keymap compiler are loaded during QGuiApplication construction,
      # and without them every render test fails with "could not load the Qt
      # platform plugin" rather than anything about the code under test.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxkbcommon0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # flock, tar and sha256sum are what the installer and cross-validator
      # suites need. They are present on ubuntu-latest; asserting it here means
      # a runner image change surfaces as a clear failure rather than as a
      # sudden drop in the number of tests that actually ran.
      - name: Verify shell prerequisites
        run: |
          for tool in bash flock tar sha256sum python3; do
            command -v "$tool" >/dev/null || { echo "missing: $tool"; exit 1; }
          done

      - name: Run the full test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/run_all.py

      # The suite is only meaningful if nothing skipped. run_all.py prints a
      # NOTE line when anything did; this turns that into a failure, because a
      # silent skip is exactly how the validator drift survived for so long.
      - name: Fail if any test skipped
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python tests/run_all.py 2>&1 | tee /tmp/suite.log
          if grep -q "test(s) were skipped" /tmp/suite.log; then
            echo "::error::Tests were skipped on Linux, where the full suite must run."
            exit 1
          fi

  shellcheck:
    name: Shell scripts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Every one of these runs as root on a panel or drives a deployment.
      # A syntax check is the floor; shellcheck catches the unquoted expansion
      # and the `cmd; [ $? -ne 0 ]` pattern that CONTRACT section 7 forbids and
      # that this codebase has shipped before.
      - name: Syntax check
        run: |
          bash -n deploy/deploy_to_hmi.sh
          bash -n deploy/provision_pyside2.sh
          sh -n deploy/provision_remote.sh
          sh -n target/bin/hmi-install
          sh -n target/bin/hmi-gui-launch
          sh -n target/bin/hmi-hwd-launch

      - name: shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck --severity=warning \
            deploy/deploy_to_hmi.sh \
            deploy/provision_remote.sh \
            target/bin/hmi-install \
            target/bin/hmi-gui-launch \
            target/bin/hmi-hwd-launch

  line-endings:
    name: Line endings
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # A CRLF in a shell script breaks its shebang on the target
      # ("bad interpreter: /bin/sh^M") and a CRLF in a systemd unit is
      # silently mis-parsed. .gitattributes normalises on checkout; this
      # asserts nothing slipped in regardless.
      - name: No CRLF in tracked text files
        run: |
          offenders=$(git ls-files -z \
            | xargs -0 grep -rlI $'\r' 2>/dev/null || true)
          if [ -n "$offenders" ]; then
            echo "::error::CRLF line endings found in:"
            echo "$offenders"
            exit 1
          fi
