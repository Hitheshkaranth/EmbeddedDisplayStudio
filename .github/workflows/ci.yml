# Continuous integration for EmbeddedDisplay Studio.
#
# WHY THIS EXISTS
#   The cross-validator suite, the installer atomicity suite and everything
#   else that needs flock only run on a POSIX host. Development happens on
#   Windows, where those tests skip -- so before this workflow existed, the
#   suites guarding the deployment chain had no automated run anywhere, and a
#   green local result meant one of the three manifest validators had been
#   exercised.
#
#   The whole point of this file is that the Linux-only half of the suite runs
#   on every push, and that a skip is visible rather than silent.

name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A second push to the same branch supersedes the first; there is no value in
# finishing a run against a commit nobody will look at again.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Full suite (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Qt needs these even under the offscreen platform plugin: libEGL and
      # the xkb keymap compiler are loaded during QGuiApplication construction,
      # and without them every render test fails with "could not load the Qt
      # platform plugin" rather than anything about the code under test.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxkbcommon0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # flock, tar and sha256sum are what the installer and cross-validator
      # suites need. They are present on ubuntu-latest; asserting it here means
      # a runner image change surfaces as a clear failure rather than as a
      # sudden drop in the number of tests that actually ran.
      - name: Verify shell prerequisites
        run: |
          for tool in bash flock tar sha256sum python3; do
            command -v "$tool" >/dev/null || { echo "missing: $tool"; exit 1; }
          done

      - name: Run the full test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/run_all.py

      # The suite is only meaningful if nothing skipped. run_all.py prints a
      # NOTE line when anything did; this turns that into a failure, because a
      # silent skip is exactly how the validator drift survived for so long.
      - name: Fail if any test skipped
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python tests/run_all.py 2>&1 | tee /tmp/suite.log
          if grep -q "test(s) were skipped" /tmp/suite.log; then
            echo "::error::Tests were skipped on Linux, where the full suite must run."
            exit 1
          fi

  package:
    name: Windows executable
    runs-on: windows-latest
    # Long enough for PyInstaller to walk the whole PySide6 graph plus the
    # standard library, and for the smoke run to wait out its own deadline.
    timeout-minutes: 40

    # Needed only by the release step below, which runs on tags.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      # WHY THIS JOB EXISTS
      #   The Studio ships as a single Windows binary and nothing built one
      #   here. Every release binary was produced by hand on one machine, and
      #   0.0.1 shipped an executable that died on a customer application's
      #   first standard-library import while every test on this workflow
      #   passed. A green source tree says nothing about the artefact; only
      #   running the artefact does.
      - name: Build the executable
        run: python -m PyInstaller packaging/EmbeddedDisplayStudio.spec --noconfirm

      # The sub-commands the packaged Studio uses to re-execute itself. Each
      # exercises a different part of the frozen runtime, and all are headless.
      - name: Sub-commands answer
        shell: bash
        run: |
          set -euo pipefail
          ./dist/EmbeddedDisplayStudio.exe --pip-install --version | grep -q "^pip "
          echo "  pip runs inside the bundle"
          ./dist/EmbeddedDisplayStudio.exe --deps-scan tests/fixtures/ci-smoke >/dev/null
          echo "  dependency scan runs as a child of itself"

      # The real gate: launch the binary, have it preview an application whose
      # imports were never visible to the build, and grab the bezel. The
      # fixture imports pkgutil -- the exact module 0.0.1 could not find -- and
      # paints a colour nothing in the Studio's own chrome uses, so finding it
      # in the grab means the frame came from the application.
      - name: Preview a bundle and grab the bezel
        env:
          # No desktop to talk to. The Studio and the preview child are both
          # told, or the child falls back to the native plugin and dies.
          QT_QPA_PLATFORM: offscreen
          HMI_PREVIEW_PLATFORM: offscreen
        run: |
          ./dist/EmbeddedDisplayStudio.exe `
            --bundle tests/fixtures/ci-smoke `
            --capture-bezel smoke.png `
            --exit-after 60000

      - name: The grab contains the application
        run: python tests/verify_smoke_capture.py smoke.png

      - name: Keep the binary and the evidence
        uses: actions/upload-artifact@v4
        with:
          name: EmbeddedDisplayStudio
          path: |
            dist/EmbeddedDisplayStudio.exe
            smoke.png
          if-no-files-found: error

      # A tag publishes the binary this job built and proved. Nothing attached
      # by hand: that is how a binary nobody had run reached a release page.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          sha=$(python -c "import hashlib,sys;print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest())" dist/EmbeddedDisplayStudio.exe)
          echo "SHA-256 $sha"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "EmbeddedDisplay Studio ${tag#v}" --generate-notes
          fi
          gh release upload "$tag" dist/EmbeddedDisplayStudio.exe --clobber

  qt5-preview:
    name: Qt5 preview (PySide2)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Two interpreters, deliberately. The bindings cannot coexist in one
      # process -- that incompatibility is why the panel carries two runtimes
      # -- so the Studio runs under PySide6 and hands a Qt5 bundle to a
      # separate interpreter. PySide2 has no wheels for 3.12, which is the
      # other reason this cannot simply be added to the suite above.
      - name: Python for the Studio
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Python for the Qt5 bundle
        id: qt5
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install PySide2 into the Qt5 interpreter
        run: ${{ steps.qt5.outputs.python-path }} -m pip install PySide2==5.15.2.1

      - name: Install the Studio's own dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4             libxcb-keysyms1 libxcb-shape0 libgl1

      # WHY THIS JOB EXISTS
      #   A PySide2 bundle is the class of application this platform exists to
      #   adopt. The shim wrapped QApplication.exec -- a name PySide6 has and
      #   PySide2 does not -- so every Qt5 bundle failed before its entry point
      #   was reached, and nothing here would have failed on the day it broke.
      #   The regression test written for it skips wherever no PySide2
      #   interpreter exists, which was everywhere this workflow runs.
      - name: Preview a real Qt5 application
        env:
          QT_QPA_PLATFORM: offscreen
          HMI_PREVIEW_PLATFORM: offscreen
          HMI_PREVIEW_PYTHON_QT5: ${{ steps.qt5.outputs.python-path }}
        run: |
          python -m unittest -v             tests.test_native_preview.Qt5BundlePreview             tests.test_native_preview.ShimBindingCompatibility

      # The test skips itself when it cannot find an interpreter, and a job
      # that silently passes by skipping is the thing this workflow exists to
      # prevent.
      - name: Fail if the Qt5 test skipped
        env:
          QT_QPA_PLATFORM: offscreen
          HMI_PREVIEW_PLATFORM: offscreen
          HMI_PREVIEW_PYTHON_QT5: ${{ steps.qt5.outputs.python-path }}
        run: |
          python -m unittest tests.test_native_preview.Qt5BundlePreview 2>&1             | tee qt5.log
          if grep -qi "skipped" qt5.log; then
            echo "::error::the Qt5 preview test skipped; PySide2 was not usable"
            exit 1
          fi

  shellcheck:
    name: Shell scripts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Every one of these runs as root on a panel or drives a deployment.
      # A syntax check is the floor; shellcheck catches the unquoted expansion
      # and the `cmd; [ $? -ne 0 ]` pattern that CONTRACT section 7 forbids and
      # that this codebase has shipped before.
      - name: Syntax check
        run: |
          bash -n deploy/deploy_to_hmi.sh
          bash -n deploy/provision_pyside2.sh
          sh -n deploy/provision_remote.sh
          sh -n target/bin/hmi-install
          sh -n target/bin/hmi-gui-launch
          sh -n target/bin/hmi-hwd-launch

      - name: shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck --severity=warning \
            deploy/deploy_to_hmi.sh \
            deploy/provision_remote.sh \
            target/bin/hmi-install \
            target/bin/hmi-gui-launch \
            target/bin/hmi-hwd-launch

  line-endings:
    name: Line endings
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # A CRLF in a shell script breaks its shebang on the target
      # ("bad interpreter: /bin/sh^M") and a CRLF in a systemd unit is
      # silently mis-parsed. .gitattributes normalises on checkout; this
      # asserts nothing slipped in regardless.
      - name: No CRLF in tracked text files
        run: |
          offenders=$(git ls-files -z \
            | xargs -0 grep -rlI $'\r' 2>/dev/null || true)
          if [ -n "$offenders" ]; then
            echo "::error::CRLF line endings found in:"
            echo "$offenders"
            exit 1
          fi
