# /etc/systemd/system/weston.service.d/hmi-x11-unix.conf
#
# Installed with the Qt app launcher (tools/hmi_deployer/qt_deploy.py).
#
# The image's weston.ini enables Xwayland, and Weston 12 segfaults at startup
# when it cannot bind /tmp/.X11-unix/X0 because the directory is missing:
# "failed to bind to /tmp/.X11-unix/X0: No such file or directory", then
# SEGV, and hmi-gui.service fails as a dependency. /usr/lib/tmpfiles.d/x11.conf
# creates the directory at boot, but on a panel that has been up a while it
# can be gone by the time a Qt bundle first starts Weston. Creating it here
# makes every start independent of how long the panel has been up.
[Service]
ExecStartPre=/usr/bin/install -d -m 1777 /tmp/.X11-unix
