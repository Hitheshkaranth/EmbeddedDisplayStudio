# meta-hmi/conf/layer.conf
#
# This layer provides the BYOA HMI stack for Toradex Verdin i.MX8M Plus
# targets running the native Toradex Yocto Reference Multimedia Image
# (Wayland/Weston, systemd). It is NOT for Torizon OS / container-based
# deployments.

# BBFILE_COLLECTIONS: the canonical name by which bitbake identifies this
# layer.  Must be unique across all layers in bblayers.conf.
BBFILE_COLLECTIONS += "meta-hmi"

# BBFILE_PATTERN: regex that maps recipe files to this collection.
# The leading ^ anchors to LAYERDIR; the trailing .* covers subdirectories.
BBFILE_PATTERN_meta-hmi = "^${LAYERDIR}/"

# BBFILE_PRIORITY: controls recipe precedence when two layers provide the
# same recipe name.  9 is intentionally higher than the default distro and
# machine layers (typically 6-7) so that our .bbappend files take effect,
# but lower than BBFILE_PRIORITY values used by emergency override layers
# (10+).  Adjust if your layer stack already uses 9.
BBFILE_PRIORITY_meta-hmi = "9"

# LAYERDEPENDS: layers that must appear in bblayers.conf before meta-hmi.
#   core               - Yocto/OE base; always required.
#   openembedded-layer - provides python3 utility modules and common classes;
#                        part of meta-openembedded/meta-oe.
#   qt6-layer          - required by hmi-gui_1.0.bb (PySide6, QtDeclarative,
#                        QtWayland).  Integrators who replace the Python/
#                        PySide6 GUI loader with a C++ loader can drop this
#                        dependency after removing the Qt RDEPENDS from
#                        hmi-gui_1.0.bb.
LAYERDEPENDS_meta-hmi = "core openembedded-layer qt6-layer"

# LAYERSERIES_COMPAT: Yocto/OE release codenames this layer is validated
# against.  Toradex BSP mapping (as of mid-2025):
#
#   kirkstone  -> Toradex BSP 5.x  (LTS; included for mixed-fleet sites)
#   mickledore -> Toradex BSP 6.0.x
#   nanbield   -> Toradex BSP 6.1.x
#   scarthgap  -> Toradex BSP 7.x  (current LTS; primary target)
#   styhead    -> Toradex BSP 7.1+  / upstream tip
#
# The hard requirement is BSP 6 (mickledore/nanbield) and BSP 7 (scarthgap/
# styhead); kirkstone is included for backward compatibility with BSP 5
# field deployments.
LAYERSERIES_COMPAT_meta-hmi = "kirkstone mickledore nanbield scarthgap styhead"